name: cd

# `15-CICD.md §4`. Push to `main` only — every change reaches `main` via a reviewed PR from
# `dev` (CLAUDE.md HARD rule 2: never a direct push to `main`), so this workflow's own trigger
# is the deploy gate, not a review gate.
#
# No attacker-controlled free text is ever interpolated into a `run:` step here (no issue/PR
# title, body, or commit message) — every `${{ }}` reference is a GitHub-computed identifier
# (`github.sha`, `github.repository[_owner]`), a `secrets.*` value, or a prior step's own typed
# output (`steps.*.outputs.digest`), none of which an external contributor can shape into shell
# metacharacters the way a PR title/body could.
on:
  push: { branches: [main] }

# A caller's top-level `permissions:` caps what any job inside a reusable workflow it invokes
# (`uses: ./...`) can be granted, even if that callee job has its own job-level override — a
# real GitHub Actions constraint that only surfaces on an actual `workflow_call` invocation, not
# on ci.yml's own direct `push`/`pull_request` runs. Confirmed live: this workflow's first-ever
# real run (2026-09-27, first push to `main` after PR #62) failed with `startup_failure` before
# any job started, because `ci.yml`'s `scan` job needs `security-events: write` and this
# workflow's own `contents: read`-only cap silently denied it at call time. `security-events:
# write` added here so the callee's own already-correct job-level grant can actually take effect.
permissions:
  contents: read
  security-events: write

concurrency:
  group: cd-main
  cancel-in-progress: false # never cancel a deploy mid-flight

env:
  REGISTRY: ghcr.io
  # Container registry paths must be lowercase; GitHub preserves the owner's display casing.
  IMAGE_BASE: ghcr.io/ifbilal/civicpulse

jobs:
  test:
    uses: ./.github/workflows/ci.yml # reuse — the suite runs on the MERGED result on main
    secrets: inherit
    permissions:
      contents: read
      security-events: write

  build-push:
    needs: test # §5.3 −8 if absent — never publish an image from code already known broken
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: write, id-token: write }
    outputs:
      backend-digest: ${{ steps.be.outputs.digest }}
      frontend-digest: ${{ steps.fe.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }} # scoped, revocable, auto-rotated
      - id: be
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-backend:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-backend:latest
          build-args: GIT_SHA=${{ github.sha }}
          provenance: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - id: fe
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_BASE }}-frontend:${{ github.sha }}
            ${{ env.IMAGE_BASE }}-frontend:latest
          provenance: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.IMAGE_BASE }}-backend:${{ github.sha }}"
          format: spdx-json
          output-file: sbom-backend.spdx.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: "sbom-*.spdx.json" }
      - name: cosign keyless sign (bonus +3)
        uses: sigstore/cosign-installer@v3
      - run: |
          cosign sign --yes "${{ env.IMAGE_BASE }}-backend@${{ steps.be.outputs.digest }}"
          cosign sign --yes "${{ env.IMAGE_BASE }}-frontend@${{ steps.fe.outputs.digest }}"

  deploy-k8s:
    needs: build-push # §5.3 −8 if absent — never deploy an unpublished/unverified image
    runs-on: ubuntu-24.04
    permissions: { contents: read, packages: read, id-token: write }
    steps:
      - uses: actions/checkout@v4
      - name: install cosign for signature verification
        uses: sigstore/cosign-installer@v3
      - name: verify signatures before deploying (bonus)
        run: |
          cosign verify "${{ env.IMAGE_BASE }}-backend@${{ needs.build-push.outputs.backend-digest }}" \
            --certificate-identity-regexp "https://github.com/${{ github.repository }}/.*" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - uses: helm/kind-action@v1
        with: { cluster_name: civicpulse-ci, wait: 180s, node_image: "kindest/node:v1.31.4" }
        # `node_image` pinned rather than left to float — this workflow's first-ever real run
        # (2026-09-28) confirmed live that an unpinned kind-action defaults to a current
        # Kubernetes version (v1.35.0 at the time), which the ingress-nginx version below
        # predates by four minor releases; the controller pod never reached Ready inside the
        # 300s wait, timing out every real attempt. Pinning both sides to a combination
        # confirmed compatible closes the drift instead of leaving two independently-floating
        # versions to silently break again later.
      - name: ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml
          kubectl -n ingress-nginx wait --for=condition=ready pod \
            -l app.kubernetes.io/component=controller --timeout=300s
      - name: install VPA CRDs and recommender
        run: |
          git clone --depth 1 --branch vertical-pod-autoscaler-1.8.0 \
            https://github.com/kubernetes/autoscaler.git /tmp/kubernetes-autoscaler
          cd /tmp/kubernetes-autoscaler/vertical-pod-autoscaler/deploy
          # This workload uses VPA updateMode=Off, so it needs the CRD and recommender only.
          # Do not install the updater/admission webhook into this ephemeral smoke-test cluster.
          kubectl apply -f vpa-v1-crd-gen.yaml
          kubectl apply -f vpa-rbac.yaml
          kubectl apply -f recommender-deployment.yaml
          kubectl wait --for=condition=established \
            crd/verticalpodautoscalers.autoscaling.k8s.io --timeout=120s
          kubectl -n kube-system rollout status deployment/vpa-recommender --timeout=180s
      - name: secrets from GitHub Secrets — never from the repo
        run: |
          kubectl create namespace civicpulse --dry-run=client -o yaml | kubectl apply -f -
          kubectl -n civicpulse create secret generic app-secrets \
            --from-literal=POSTGRES_USER=civicpulse \
            --from-literal=POSTGRES_PASSWORD='${{ secrets.POSTGRES_PASSWORD }}' \
            --from-literal=DATABASE_URL='postgresql+psycopg://civicpulse:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/civicpulse' \
            --from-literal=LLM_API_KEY='${{ secrets.LLM_API_KEY }}' \
            --dry-run=client -o yaml | kubectl apply -f -
      - name: pin the overlay to THIS commit's digest (§5.3 −8 — never :latest)
        run: |
          cd k8s/overlays/prod
          kustomize edit set image \
            ${{ env.IMAGE_BASE }}-backend=${{ env.IMAGE_BASE }}-backend@${{ needs.build-push.outputs.backend-digest }} \
            ${{ env.IMAGE_BASE }}-frontend=${{ env.IMAGE_BASE }}-frontend@${{ needs.build-push.outputs.frontend-digest }}
          kustomize build . | tee /tmp/rendered.yaml | grep -E 'image:'
      - run: kubectl apply -f /tmp/rendered.yaml
      - run: |
          kubectl -n civicpulse rollout status statefulset/postgres --timeout=300s
          kubectl -n civicpulse rollout status deployment/backend --timeout=300s
          kubectl -n civicpulse rollout status deployment/frontend --timeout=300s
      - name: smoke test through the Ingress
        run: |
          kubectl -n civicpulse port-forward svc/frontend 8080:8080 \
            >/tmp/frontend-port-forward.log 2>&1 &
          port_forward_pid=$!
          cleanup_port_forward() {
            status=$?
            trap - EXIT
            kill "$port_forward_pid" 2>/dev/null || true
            wait "$port_forward_pid" 2>/dev/null || true
            if [ "$status" -ne 0 ]; then
              cat /tmp/frontend-port-forward.log || true
            fi
            exit "$status"
          }
          trap cleanup_port_forward EXIT

          ./scripts/wait_for.sh http://localhost:8080/api/stats 90
          curl --connect-timeout 2 --max-time 10 -sf localhost:8080/api/stats | jq -e '.total >= 0'
          id=$(curl --connect-timeout 2 --max-time 10 -sf -XPOST \
            localhost:8080/api/complaints -H 'content-type: application/json' \
            -d @fixtures/one.json | jq -er .id)
          curl --connect-timeout 2 --max-time 10 -sf \
            "localhost:8080/api/complaints/$id" | jq -e '.category != null'
      - run: kubectl -n civicpulse get hpa # §3.4 — "print kubectl get hpa"
      - if: failure()
        name: diagnose cluster failure (best effort)
        run: |
          kubectl get pods -A -o wide || true
          kubectl get events -A --sort-by=.metadata.creationTimestamp | tail -n 100 || true
          kubectl -n ingress-nginx describe pods -l app.kubernetes.io/component=controller || true
          kubectl -n ingress-nginx logs deployment/ingress-nginx-controller --tail=200 || true
          kubectl -n kube-system describe deployment/vpa-recommender || true
          kubectl -n kube-system logs deployment/vpa-recommender --tail=200 || true
          kubectl -n civicpulse logs -l app=frontend --tail=200 --all-containers || true
          kubectl -n civicpulse describe pods || true
          kubectl -n civicpulse logs -l app=backend --tail=200 --all-containers || true
