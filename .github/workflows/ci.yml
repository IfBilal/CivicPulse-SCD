name: ci

# Phase 0 placeholder. Superseded by the full pipeline (lint-and-type, test-backend,
# test-frontend, build, scan, manifests, integration) built in Phase 5 — see
# docs/15-CICD.md. This exists so branch protection has a real job to require, and so
# the repo has a green CI signal from day one (docs/03-REPO-BOOTSTRAP.md §Phase 0).

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read   # gitleaks-action needs this to diff a PR against its base

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history to diff a PR's base..head range
      - name: repo hygiene sanity checks
        run: |
          test -f .gitignore
          test -f .env.example
          ! grep -q '^\.env$' .gitignore || echo ".env correctly ignored"
          grep -q '^\.env$' .gitignore
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # required on pull_request events — the action diffs against the PR base
          # and refuses to run without an authenticated token to do so.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  contract:
    # Gate 1 (02-CRITICAL-PATH.md §4): unit + contract tests, and the typed client must be a
    # no-op regeneration — a backend contract change the frontend hasn't absorbed goes red here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install backend
        run: pip install -e "backend[dev]"
      - name: lint + type (backend)
        working-directory: backend
        run: ruff check . && ruff format --check . && mypy app
      - name: unit + contract tests
        working-directory: backend
        env:
          TRIAGE_PROVIDER: simulated
        run: pytest -m "unit or contract"
      - name: layer-boundary check (CLAUDE.md HARD rule 3)
        run: make lint-layers
      - name: typed-client drift gate
        run: |
          make gen-client
          git diff --exit-code -- openapi.json frontend/src/api/schema.d.ts frontend/src/api/openapi.json

  frontend:
    # Rubric B: lint, strict types, the component tests (MSW — zero real network), prod build.
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npx vitest run
      - run: npm run build
      - name: no business rules / secrets in browser-reachable source
        run: |
          ! grep -rnE "in_progress.*resolved|TRANSITIONS|allowedNext" src --include=*.ts --include=*.tsx --exclude=schema.d.ts
          ! grep -rniE "gsk_|AIza|password|secret|token" src public --exclude=mockServiceWorker.js

  data-layer:
    # Phase 2 (02-CRITICAL-PATH.md section 4 PHASE 2): the D1-D11 matrix from
    # 05-DATA-LAYER.md section 8. Uses testcontainers, not a services block - the suite
    # manages its own Postgres container per test session, which ubuntu-24.04 runners
    # support natively (Docker daemon preinstalled). This is Phase 2's own
    # migration/repository/seed verification, distinct from Phase 5's integration job
    # (the full compose-stack smoke test).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: install backend
        run: pip install -e "backend[dev]"
      - name: data-layer integration tests (real Postgres via testcontainers)
        working-directory: backend
        run: pytest -m integration -k "test_migrations or test_complaint_repo or test_seed" -v
