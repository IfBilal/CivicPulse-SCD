name: ci

# Phase 5 (02-CRITICAL-PATH.md, 15-CICD.md §3): the full pipeline. Job names are load-bearing —
# branch protection references them verbatim as required checks. Renaming one silently disables
# its check (15-CICD.md §2 trap 2) — re-select in branch protection if you ever do.

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [dev]
  workflow_call: # so cd.yml's `uses: ./.github/workflows/ci.yml` can invoke this workflow

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  TRIAGE_PROVIDER: simulated   # §2.5 — CI is pinned to the deterministic provider

# GitHub's own default `run:` shell is `bash -e {0}` — NOT `-o pipefail`. Without it, a pipeline
# like `kustomize build ... | kubeconform ...` reports only the last command's exit code, so a
# failing kustomize with a healthy-on-empty-input kubeconform silently reports success (found
# running this job for real — see docs/AI-USAGE.md, 2026-09-25). Set it globally rather than
# per-step so no future pipe in this file can repeat the same masking bug.
defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  lint-and-type:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # gitleaks needs full history to diff a PR's base..head range
      - name: gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e "backend[dev]"
      - run: cd backend && ruff check --output-format=github .
      - run: cd backend && ruff format --check .
      - run: cd backend && mypy app
      - run: make lint-layers    # CLAUDE.md HARD rule 3 — SQL out of routes, no upward imports
      - run: make lint-localhost # §5.3 −8 armour
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: cd frontend && npm run lint
      - run: cd frontend && npx tsc --noEmit
      - name: OpenAPI client drift gate   # 04-CONTRACTS.md §8 · 11-FRONTEND.md §4
        run: |
          make gen-client
          git diff --exit-code openapi.json frontend/src/api/schema.d.ts frontend/src/api/openapi.json \
            || (echo "::error::schema.d.ts is stale — run 'make gen-client' and commit"; exit 1)

  test-backend:
    # No `services:` postgres/redis and no ambient DATABASE_URL/REDIS_URL here, deliberately —
    # verified against this repo's actual test suite, not assumed from 15-CICD.md's generic
    # example. `tests/integration/conftest.py` spins its own Postgres via testcontainers
    # regardless of env (ubuntu-24.04 runners have Docker preinstalled, confirmed by the old
    # ci.yml's data-layer job), so a services: postgres would sit unused by anything that
    # matters. Worse: tests/unit/test_ready_route.py's "postgres unreachable" cases rely on
    # nothing listening at the *default* (unconfigured) database_url/redis_url — pointing those
    # at a real, reachable services: postgres/redis flips /ready to 200 and breaks 4 real tests
    # (confirmed by running it both ways; see docs/AI-USAGE.md, 2026-09-25).
    runs-on: ubuntu-24.04
    env:
      TRIAGE_PROVIDER: simulated
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/pyproject.toml }
      - run: pip install -e "backend[dev]"
      - run: cd backend && pytest   # --cov-fail-under=65 lives in backend/pyproject.toml; runs unit+contract+integration
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage-xml, path: backend/coverage.xml }

  test-frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run --coverage --reporter=default --reporter=json --outputFile=coverage/test-results.json
      - name: assert ≥5 tests actually ran (Rubric B5)
        run: |
          n=$(jq '.numTotalTests' coverage/test-results.json)
          [ "$n" -ge 5 ] || { echo "::error::only $n frontend tests (rubric B requires ≥5)"; exit 1; }
      - run: npm run build
      - name: no business rules / secrets in browser-reachable source
        run: |
          ! grep -rnE "in_progress.*resolved|TRANSITIONS|allowedNext" src --include=*.ts --include=*.tsx --exclude=schema.d.ts
          ! grep -rniE "gsk_|AIza|password|secret|token" src public --exclude=mockServiceWorker.js

  build:
    runs-on: ubuntu-24.04
    permissions: { contents: read }   # notably NOT packages: write — a PR must not publish (§3.4)
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: civicpulse-backend:ci
          build-args: GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: civicpulse-frontend:ci
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: size gate (§3.1 — frontend under ~60MB)
        run: |
          sz=$(docker image inspect civicpulse-frontend:ci --format '{{.Size}}')
          echo "frontend image: $((sz/1024/1024)) MB"
          [ "$sz" -lt 67108864 ] || { echo "::error::frontend image >64MB — multi-stage split is leaking"; exit 1; }
      - run: docker save civicpulse-backend:ci civicpulse-frontend:ci -o /tmp/images.tar
      - uses: actions/upload-artifact@v4
        with: { name: ci-images, path: /tmp/images.tar, retention-days: 1 }

  scan:
    runs-on: ubuntu-24.04
    needs: build
    # Job-level override, not widened at the workflow level: `upload-sarif` (below) needs
    # `security-events: write` to publish results to the Security tab. The workflow-level
    # `permissions: contents: read` (top of this file) is correct least-privilege for every
    # other job — this is the one job that genuinely needs more, so it gets its own grant
    # rather than loosening everything. Without this, `push`-triggered runs (to `dev`) fail
    # this step with "Resource not accessible by integration" even though the scan itself
    # succeeds — `pull_request`-triggered runs on this repo happened to have a token with
    # enough access already, which is why this went unnoticed until a direct `push` run
    # surfaced it (docs/AI-USAGE.md, 2026-09-26).
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: ci-images, path: /tmp }
      - run: docker load -i /tmp/images.tar
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "civicpulse-backend:ci", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1", format: table }
      - uses: aquasecurity/trivy-action@v0.36.0
        with: { image-ref: "civicpulse-frontend:ci", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1", format: table }
      - uses: aquasecurity/trivy-action@v0.36.0   # SARIF for the Security tab
        if: always()
        with: { image-ref: "civicpulse-backend:ci", format: sarif, output: trivy.sarif, exit-code: "0" }
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with: { sarif_file: trivy.sarif }

  manifests:
    # Phase 6 (Kubernetes) landed 2026-09-26 — k8s/overlays/{dev,prod} exist and this job is
    # green. NOTE (docs/AI-USAGE.md, 2026-09-26 audit): kubeconform validates schema conformance
    # only, not "did you ship every object 13-KUBERNETES.md/14-LOAD-AUTOSCALING.md require" — a
    # green run here is not proof the k8s/ tree is complete against those docs, just that
    # whatever IS there parses. Cross-check the object inventory by hand against those docs'
    # own tables, not just this job's own color.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: fail loudly, not silently, if k8s/ ever goes missing
        # Defensive guard, kept even though k8s/ exists now: `! grep ... k8s/ || {...}` (below)
        # can't tell "no match" from "path doesn't exist" — grep exits 2 either way and `!`
        # treats any nonzero the same (the same bug class fixed in Makefile::lint-localhost).
        run: |
          if [ ! -d k8s/overlays/dev ] || [ ! -d k8s/overlays/prod ]; then
            echo "::error::k8s/overlays/{dev,prod} missing"
            exit 1
          fi
      - run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz -C /usr/local/bin kubeconform
          curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" | tar xz -C /usr/local/bin kustomize
      - name: validate both overlays
        run: |
          for ov in dev prod; do
            kustomize build "k8s/overlays/$ov" | kubeconform -strict -summary \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          done
      - name: §5.3 −8 — no :latest in any deployed manifest
        run: |
          ! kustomize build k8s/overlays/prod | grep -nE 'image:.*:latest' \
            || { echo "::error::deploying :latest (§5.3 −8)"; exit 1; }
      - name: §5.3 −15 — no real secrets in committed manifests
        run: |
          ! grep -rniE 'gsk_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{30,}' k8s/ \
            || { echo "::error::key material in k8s manifests (§5.3 −15)"; exit 1; }

  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait --wait-timeout 180
      - run: docker compose exec -T backend alembic upgrade head
      - run: docker compose exec -T backend python -m app.cli.seed
      - name: readiness
        run: ./scripts/wait_for.sh http://localhost:8080/api/stats 60
      - name: POST → GET → assert triaged
        # TRIAGE_PROVIDER=simulated is hash-based on complaint text (CLAUDE.md §4: never a live
        # LLM call in CI), not keyword-classified — backend/app/providers/triage/simulated.py.
        # Asserting one fixed category value against it would be asserting a hash coincidence,
        # not triage correctness. What's real to assert: the row was created and persisted with
        # SOME valid category from the enum, i.e. triage actually ran end-to-end.
        run: |
          id=$(curl -sf -XPOST localhost:8080/api/complaints \
                 -H 'content-type: application/json' -d @fixtures/one.json | jq -r .id)
          [ -n "$id" ] && [ "$id" != "null" ]
          cat=$(curl -sf "localhost:8080/api/complaints/$id" | jq -r .category)
          echo "category=$cat"
          [ -n "$cat" ] && [ "$cat" != "null" ] || { echo "::error::no category on created complaint"; exit 1; }
      - name: X-Cache MISS → HIT
        # #34 (Taimoor's real Redis-backed stats cache) merged into dev — verified for real
        # against a live compose stack before hard-gating this.
        #
        # FLUSHALL first: the "readiness" step above polls /api/stats via wait_for.sh, which
        # itself populates the cache as a side effect — without this, "first" here already
        # reads back that poll's HIT instead of a genuine MISS (found on a real CI run, not
        # assumed: the first attempt at this assertion failed with "first=HIT second=HIT").
        run: |
          docker compose exec -T cache redis-cli FLUSHALL
          a=$(curl -si localhost:8080/api/stats | grep -i '^x-cache:' | tr -d '\r' | awk '{print $2}')
          b=$(curl -si localhost:8080/api/stats | grep -i '^x-cache:' | tr -d '\r' | awk '{print $2}')
          echo "first=$a second=$b"
          [ "$a" = "MISS" ] && [ "$b" = "HIT" ] || { echo "::error::expected MISS then HIT, got $a/$b"; exit 1; }
      - name: POST invalidates the stats cache (fix/stats-invalidation-ordering, 2026-09-26)
        # ComplaintService.create() now calls StatsService.invalidate() after commit — verified
        # here at the HTTP level, not just in the unit/integration suite: after the MISS→HIT
        # pair above, a fresh POST must force the NEXT /api/stats read back to MISS.
        run: |
          curl -s -X POST localhost:8080/api/complaints \
            -H 'Content-Type: application/json' \
            -d '{"text":"cache invalidation ci probe, unique text for this run","location":"CI probe location"}' \
            -o /dev/null
          c=$(curl -si localhost:8080/api/stats | grep -i '^x-cache:' | tr -d '\r' | awk '{print $2}')
          echo "after-post=$c"
          [ "$c" = "MISS" ] || { echo "::error::POST did not invalidate the stats cache, got $c"; exit 1; }
      - name: network segmentation (§3.2) — this MUST fail
        run: |
          if docker compose exec -T frontend sh -c 'nc -z -w2 database 5432' 2>/dev/null; then
            echo "::error::frontend can reach the database (§5.3 −8)"; exit 1
          fi
          echo "segmentation OK: frontend cannot reach database"
      - name: rate limiter returns 429 + Retry-After
        run: |
          code=""
          for i in $(seq 1 12); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -XPOST localhost:8080/api/complaints \
                    -H 'content-type: application/json' -d @fixtures/one.json)
          done
          [ "$code" = "429" ] || { echo "::error::expected 429 after 12 requests (limit=10), got $code"; exit 1; }
          curl -si -XPOST localhost:8080/api/complaints -H 'content-type: application/json' \
            -d @fixtures/one.json | grep -i '^retry-after:'
      - if: always()
        run: docker compose logs --no-color > compose-logs.txt
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: compose-logs, path: compose-logs.txt }
      - if: always()
        run: docker compose down -v
