name: release

# `15-CICD.md §5`. Fires on a semver tag push — a human decision to cut a release, not every
# merge to main. Builds and publishes the backend image under semver tags (major, major.minor,
# full version, plus the commit SHA for traceability) and attaches the SBOM already produced by
# cd.yml's build-push job as a GitHub Release asset.
#
# Same safe-interpolation posture as cd.yml's own header comment: every `${{ }}` reference here
# is a GitHub-computed identifier (`github.sha`, `github.actor`, `github.repository_owner`) or a
# prior step's own typed output (`steps.meta.outputs.*`) — never attacker-controlled free text
# like a tag message, commit message, or PR title.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write
  id-token: write

env:
  IMAGE_BASE: ghcr.io/${{ github.repository_owner }}/civicpulse

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 } # full history for generate_release_notes

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_BASE }}-backend
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: GIT_SHA=${{ github.sha }}
          provenance: true

      - name: SBOM (Syft) for the release artefact
        uses: anchore/sbom-action@v0
        with:
          image: "${{ env.IMAGE_BASE }}-backend:${{ github.sha }}"
          format: spdx-json
          output-file: sbom-release-backend.spdx.json

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: sbom-release-backend.spdx.json
