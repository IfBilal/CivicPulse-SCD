title = "civicpulse"
[extend]
useDefault = true

[[rules]]
id = "groq-key"
description = "Groq API key"
regex = '''gsk_[A-Za-z0-9]{40,}'''
tags = ["key","groq"]

[[rules]]
id = "google-ai-key"
description = "Google AI Studio key"
regex = '''AIza[0-9A-Za-z\-_]{35}'''

[[rules]]
id = "k8s-secret-nonplaceholder"
description = "base64 blob in a committed k8s Secret (§5.3 −15)"
path = '''k8s/.*secret.*\.ya?ml'''
# NOTE: gitleaks compiles rules with RE2 (via wasilibs/go-re2), which does not
# support lookahead. A (?!...) negative-lookahead here (as in the original
# doc example) crashes gitleaks outright rather than just failing to match.
# Match broadly instead, and suppress known-placeholder values via allowlist.
regex = '''(?i)(api[_-]?key|password)\s*:\s*['"]?[A-Za-z0-9+/=]{16,}'''

  [rules.allowlist]
  regexes = ['''(?i)(PLACEHOLDER|CHANGE_ME)''']

[allowlist]
paths = ['''\.env\.example$''', '''docs/.*\.md$''', '''.*\.test\.tsx?$''']
