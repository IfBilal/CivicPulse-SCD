[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `alembic/` sits alongside `app/` for the CLI's `script_location`, but it's not an
# importable package the app ships — without this, setuptools' flat-layout autodiscovery
# sees two top-level packages and refuses to build (`pip install -e` fails outright).
include = ["app*"]

[project]
name = "civicpulse-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  # fastapi/starlette/pydantic bumped together, 2026-09-26: starlette==0.46.2 (fastapi==0.115.*'s
  # resolved pin) carried 3 real HIGH CVEs (CVE-2025-62727, CVE-2026-48818, CVE-2026-54283), fixed
  # upstream in 0.49.1/1.1.0/1.3.1. fastapi==0.115.* caps starlette below 0.47 regardless of patch
  # version, so the CVE fix requires a real fastapi minor bump, not a standalone starlette pin.
  # fastapi==0.121.* is the earliest minor allowing starlette>=0.49 (checked each minor's own
  # `Requires-Dist: starlette` bound directly); that pulls in a pydantic v1-compat code path
  # (`fastapi.encoders.jsonable_encoder`) that trips `pydantic==2.9.*`'s own deprecation warnings
  # under this repo's `filterwarnings = ["error::DeprecationWarning"]` — pydantic bumped to 2.11.*
  # alongside it. Full suite (271 unit+contract tests) re-verified green against this combination.
  "fastapi==0.121.*", "uvicorn[standard]==0.32.*", "pydantic==2.11.*",
  "pydantic-settings==2.6.*", "sqlalchemy==2.0.*", "psycopg[binary,pool]==3.2.*",
  "alembic==1.13.*", "redis==5.2.*", "httpx==0.27.*", "openai==1.54.*",
  "prometheus-client==0.21.*", "python-json-logger==2.0.*", "orjson==3.11.*",
  "starlette>=0.49.1,<0.50",
]

[project.optional-dependencies]
dev = ["pytest==8.3.*","pytest-asyncio==0.24.*","pytest-cov==5.0.*","anyio==4.6.*",
       "ruff==0.7.*","mypy==1.13.*","types-redis","testcontainers[postgres,redis]==4.8.*","hypothesis==6.112.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM","ASYNC","S","T20","RUF"]
# S = bandit. S105/S106 hardcoded-password checks stay ON — that is deduction armour.
ignore = ["S101"]           # assert is fine in tests
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S","T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=65"
markers = ["unit","integration","contract","slow"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/cli/*", "alembic/*"]
