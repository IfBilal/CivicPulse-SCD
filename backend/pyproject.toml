[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
# `alembic/` sits alongside `app/` for the CLI's `script_location`, but it's not an
# importable package the app ships — without this, setuptools' flat-layout autodiscovery
# sees two top-level packages and refuses to build (`pip install -e` fails outright).
include = ["app*"]

[project]
name = "civicpulse-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  # fastapi/starlette/pydantic bumped together, 2026-09-26: starlette==0.46.2 (fastapi==0.115.*'s
  # original resolved pin) carried 3 real HIGH CVEs (CVE-2025-62727, CVE-2026-48818,
  # CVE-2026-54283), fixed upstream in 0.49.1/1.1.0/1.3.1 respectively. Closing all three needed
  # fastapi>=0.130 (the first line to drop its own starlette<1.0.0 ceiling) — a smaller bump to
  # fastapi==0.121.* only reached starlette==0.49.3, closing CVE-2025-62727 alone. The deeper jump
  # (fastapi==0.135.*, allowing starlette>=1.1.0) broke `app/deps.py`'s Redis dependency
  # injection at import time (`TypeError: ... is not a generic class` — `Redis[str]` isn't
  # actually evaluable at runtime, and fastapi>=0.130's stricter signature resolution tries to
  # eval it for real); fixed there (see that file's own comments) rather than left broken.
  # pydantic bumped 2.9.* -> 2.11.* alongside fastapi==0.121: `fastapi.encoders.jsonable_encoder`
  # uses a pydantic v1-compat path that trips 2.9.*'s own deprecation warning under this repo's
  # `filterwarnings = ["error::DeprecationWarning"]`. Full suite (271 unit+contract tests)
  # re-verified green against the final fastapi==0.135.*/starlette==1.3.1/pydantic==2.11.*
  # combination, including a real end-to-end TestClient request through the app's lifespan.
  "fastapi==0.135.*", "uvicorn[standard]==0.32.*", "pydantic==2.11.*",
  "pydantic-settings==2.6.*", "sqlalchemy==2.0.*", "psycopg[binary,pool]==3.2.*",
  "alembic==1.13.*", "redis==5.2.*", "httpx==0.27.*", "openai==1.54.*",
  "prometheus-client==0.21.*", "python-json-logger==2.0.*", "orjson==3.11.*",
  "starlette>=1.3.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.*","pytest-asyncio==0.24.*","pytest-cov==5.0.*","anyio==4.6.*",
       "ruff==0.7.*","mypy==1.13.*","types-redis","testcontainers[postgres,redis]==4.8.*","hypothesis==6.112.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E","F","I","UP","B","SIM","ASYNC","S","T20","RUF"]
# S = bandit. S105/S106 hardcoded-password checks stay ON — that is deduction armour.
ignore = ["S101"]           # assert is fine in tests
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S","T20"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_any_generics = true
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --strict-markers --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=65"
markers = ["unit","integration","contract","slow"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning"]

[tool.coverage.run]
branch = true
source = ["app"]
omit = ["app/cli/*", "alembic/*"]
