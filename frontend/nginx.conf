# Full main config (replaces the image's) so nginx runs as a non-root user.
# Non-root gotchas (11-FRONTEND.md §5): (1) listen 8080, (2) pid in /tmp, (3) temp paths in /tmp,
# (4) entrypoint scripts run as `app` and only write where `app` owns.
worker_processes auto;
pid /tmp/nginx/nginx.pid;
error_log /dev/stderr warn;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;

  client_body_temp_path /tmp/nginx/client_body;
  proxy_temp_path       /tmp/nginx/proxy;
  fastcgi_temp_path     /tmp/nginx/fastcgi;
  uwsgi_temp_path       /tmp/nginx/uwsgi;
  scgi_temp_path        /tmp/nginx/scgi;

  gzip on;
  gzip_types application/javascript text/css application/json image/svg+xml;

  server {
    listen 8080;                                  # non-root cannot bind < 1024
    server_name _;
    root /usr/share/nginx/html;

    # Written at container start by docker-entrypoint.d/10-config.sh:
    #   resolver <nameserver from /etc/resolv.conf>;  set $backend_upstream <BACKEND_UPSTREAM>;
    include /tmp/nginx/runtime.conf;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # Same-origin API proxy — the reason the bundle holds no API URL (ADR-0002).
    # A variable upstream is resolved per request, so nginx starts even if the backend is not up
    # yet (compose ordering, k8s rollouts, the build-once-deploy-many evidence run).
    location /api/ {
      proxy_pass http://$backend_upstream;         # service name — NEVER localhost (§5.3 −8)
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID      $request_id;
      proxy_read_timeout 30s;                      # > the 12 s triage budget
      proxy_connect_timeout 2s;
    }

    # config.js changes per environment — never cache it; hashed assets are immutable.
    # NB: any add_header in a location DROPS the server-level ones, so repeat all three.
    location = /config.js {
      add_header Cache-Control "no-store" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
    }
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable" always;
      add_header X-Content-Type-Options nosniff always;
      add_header X-Frame-Options DENY always;
      add_header Referrer-Policy no-referrer always;
    }

    location / {
      try_files $uri $uri/ /index.html;            # SPA fallback
    }
  }
}
