# PLACEHOLDER values only — never a real credential in git (CLAUDE.md HARD rule 1, §5.3 −15
# even base64-encoded). Real values are injected at deploy time via
# `kubectl create secret ... --dry-run=client -o yaml | kubectl apply -f -` in cd.yml, from
# GitHub Secrets, never committed. .gitleaks.toml's k8s-secret-nonplaceholder rule enforces this
# mechanically on any file under k8s/ whose name contains "secret".
apiVersion: v1
kind: Secret
metadata:
  name: app-secrets
  namespace: civicpulse
type: Opaque
stringData:
  POSTGRES_USER: "PLACEHOLDER_DO_NOT_COMMIT_REAL_VALUES"
  POSTGRES_PASSWORD: "PLACEHOLDER_DO_NOT_COMMIT_REAL_VALUES"
  # backend/app/settings.py's `database_url` field is one fully-formed connection string, not
  # assembled from parts — postgres is the Service name (§7), never localhost (§5.3 −8).
  DATABASE_URL: "postgresql+psycopg://PLACEHOLDER_DO_NOT_COMMIT_REAL_VALUES:PLACEHOLDER_DO_NOT_COMMIT_REAL_VALUES@postgres:5432/civicpulse"
  LLM_API_KEY: "PLACEHOLDER_DO_NOT_COMMIT_REAL_VALUES"
