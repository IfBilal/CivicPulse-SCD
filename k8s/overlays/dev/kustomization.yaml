apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: civicpulse
resources: [../../base]
images:
  - name: ghcr.io/ifbilal/civicpulse-backend
    newTag: dev
  - name: ghcr.io/ifbilal/civicpulse-frontend
    newTag: dev
# No ConfigMap patch needed — base/configmap.yaml already defaults to dev-appropriate values
# (APP_ENV=dev, TRUSTED_PROXY_HOPS=1).
patches:
  - path: ingress-host.yaml
    target: { kind: Ingress, name: civicpulse }
