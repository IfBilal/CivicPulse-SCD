apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: civicpulse
resources: [../../base]
images:
  - name: ghcr.io/ifbilal/civicpulse-backend
    newTag: PLACEHOLDER_SHA   # kustomize edit set image is how CD injects the real SHA — never sed
  - name: ghcr.io/ifbilal/civicpulse-frontend
    newTag: PLACEHOLDER_SHA
replicas:
  - { name: backend, count: 3 }
  - { name: frontend, count: 2 }
patches:
  - path: backend-resources.yaml
    target: { kind: Deployment, name: backend }
  - path: ingress-host.yaml
    target: { kind: Ingress, name: civicpulse }
  - path: configmap-patch.yaml
    target: { kind: ConfigMap, name: app-config }
